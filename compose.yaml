services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: poker_academy
      POSTGRES_PASSWORD: poker_academy_local
      POSTGRES_USER: poker_academy
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poker_academy -d poker_academy"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - poker_academy_postgres:/var/lib/postgresql/data

volumes:
  poker_academy_postgres:
